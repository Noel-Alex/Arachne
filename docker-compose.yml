networks:
  arachne-net:
    driver: bridge

volumes:
  nats_data:
    driver: local
  scylla_data:
    driver: local
  grafana_data:
    driver: local

services:
  # --- MESSAGING (NATS JetStream) ---
  nats:
    image: nats:latest
    container_name: arachne-nats
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "-m"
      - "8222"
    ports:
      - "4223:4222"   # Client connections
      - "8223:8222"   # HTTP monitoring + Prometheus metrics
    volumes:
      - nats_data:/data
    restart: unless-stopped
    networks:
      - arachne-net

  # --- DATA STORE (ScyllaDB) ---
  scylla:
    image: scylladb/scylla:latest
    container_name: arachne-scylla
    ports:
      - "9042:9042"   # CQL native protocol
      - "9180:9180"   # Prometheus metrics
    volumes:
      - scylla_data:/var/lib/scylla
    command:
      - --smp=2
      - --developer-mode=1
      - --memory=4G
      - --cluster-name=arachne-cluster
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep '^UN'"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - arachne-net

  # --- MONITORING STACK ---
  prometheus:
    image: prom/prometheus:latest
    container_name: arachne-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - arachne-net
    depends_on:
      - nats
      - scylla

  loki:
    image: grafana/loki:latest
    container_name: arachne-loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - arachne-net

  promtail:
    image: grafana/promtail:latest
    container_name: arachne-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./deploy/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - arachne-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: arachne-grafana
    user: "472"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    networks:
      - arachne-net
    depends_on:
      - prometheus
      - loki