# cargo-deny configuration
# CI gate: licenses, advisories, duplicate versions, sources.

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    # scraper's HTML/CSS parsing stack (cssparser, selectors, dtoa-short)
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "warn"
ignore = [
    # RUSTSEC-2025-0141: bincode 1.x unmaintained (team ceased development; 1.3.3
    # declared complete). We only use it for the optional bincode batch-publish
    # helper on trusted NATS payloads — no untrusted deserialization. Migration
    # to postcard/bincode 2 tracked with the M2 wire-format work.
    "RUSTSEC-2025-0141",
    # RUSTSEC-2025-0057: fxhash unmaintained — transitive via scraper's
    # selectors, not our dependency. Upstream scraper/selectors must move.
    "RUSTSEC-2025-0057",
    # RUSTSEC-2024-0436: paste unmaintained — transitive via lofty (audio
    # probing), not our dependency.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0118 / RUSTSEC-2026-0119: hickory-proto DNSSEC bugs —
    # transitive via reqwest's hickory-dns resolver feature. Arachne uses
    # plain resolution (no DnssecDnsHandle) and never encodes DNS messages,
    # so neither the NSEC3 loop nor encoder compression path is reachable;
    # fix lands when reqwest moves to hickory-proto 0.26.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
