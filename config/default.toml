# Arachne Configuration
# All values can be overridden via environment variables prefixed with ARACHNE_
# e.g., ARACHNE_NATS__URL=nats://remote:4222

[nats]
url = "nats://127.0.0.1:4223"

[scylla]
uri = "127.0.0.1:9042"
keyspace = "arachne"

[database]
# Storage backend: "postgres" (recommended) or "scylla" (legacy).
backend = "postgres"
url = "postgres://arachne:arachne@127.0.0.1:5432/arachne"
max_connections = 10

[worker]
max_concurrent_requests = 512
request_timeout_secs = 15
connect_timeout_secs = 5
max_content_size_bytes = 5242880  # 5MB
max_redirects = 5
user_agent = "ArachneBot/2.0 (+https://github.com/Noel-Alex/Arachne)"
retry_attempts = 2
retry_backoff_ms = 500

[coordinator]
max_pages_per_domain = 50000
batch_size = 5000
dedup_bloom_capacity = 100000000
dedup_bloom_fp_rate = 0.001

[politeness]
default_crawl_delay_ms = 250
max_crawl_delay_ms = 5000
robots_cache_ttl_secs = 86400
respect_robots_txt = true

[storage]
content_dir = "./crawled_data"
store_raw_html = true

[media]
store_dir = "./media_store"
max_audio_size_bytes = 524288000   # 500MB
min_free_bytes = 5368709120        # 5GB
max_total_bytes = 0                # unlimited
min_duration_secs = 30
max_duration_secs = 1800
min_bitrate_kbps = 96
per_host_concurrency = 4

[metrics]
enabled = true
port = 9191
