global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nats'
    metrics_path: /metrics
    static_configs:
      - targets: ['nats:8222']

  - job_name: 'scylla'
    scrape_interval: 5s
    static_configs:
      - targets: ['scylla:9180']
        labels:
          cluster: 'arachne'

  - job_name: 'arachne-worker'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:9191']
        labels:
          component: 'worker'

  - job_name: 'arachne-coordinator'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:9192']
        labels:
          component: 'coordinator'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
