<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Arachne media harvesting pipeline: source adapters feed manifest-first admission where a license is mandatory; download tasks flow to workers which stream, verify, probe, and quality-gate files into the content-addressed store; the track manifest is exported as a handoff bundle">
  <defs>
    <marker id="harrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="harrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="harrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="harrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d2a8ff"/>
    </marker>
  </defs>

  <!-- panels -->
  <rect x="1" y="1" width="898" height="418" rx="14" fill="#010409"/>
  <rect x="12" y="12" width="876" height="396" rx="10" fill="#0d1117"/>

  <!-- ============ Source adapters ============ -->
  <g>
    <rect x="40" y="60" width="180" height="52" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="130" y="82" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Jamendo</text>
    <text x="130" y="100" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">~500k CC tracks</text>
  </g>
  <g>
    <rect x="40" y="132" width="180" height="52" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="130" y="154" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Archive.org</text>
    <text x="130" y="172" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">netlabels · contact required</text>
  </g>
  <g>
    <rect x="40" y="204" width="180" height="52" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="130" y="226" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">FMA corpus</text>
    <text x="130" y="244" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">offline metadata · bulk zips</text>
  </g>

  <!-- arrows adapters -> admission -->
  <line x1="220" y1="86" x2="298" y2="140" stroke="#8b949e" stroke-width="2" marker-end="url(#harrow)"/>
  <line x1="220" y1="158" x2="298" y2="158" stroke="#8b949e" stroke-width="2" marker-end="url(#harrow)"/>
  <line x1="220" y1="230" x2="298" y2="176" stroke="#8b949e" stroke-width="2" marker-end="url(#harrow)"/>

  <!-- ============ Admission ============ -->
  <g>
    <rect x="302" y="96" width="216" height="124" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <rect x="302" y="96" width="216" height="26" rx="10" fill="#8957e5"/>
    <rect x="302" y="110" width="216" height="12" fill="#8957e5"/>
    <text x="410" y="115" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">manifest-first admission</text>
    <rect x="318" y="134" width="184" height="24" rx="6" fill="#2b1a3d" stroke="#a371f7" stroke-width="1"/>
    <text x="410" y="150" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#d2a8ff">license MANDATORY</text>
    <text x="410" y="178" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">TrackRecord row first (IF NOT</text>
    <text x="410" y="196" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">EXISTS); only new ids get tasks</text>
  </g>

  <!-- arrow admission -> workers -->
  <line x1="518" y1="158" x2="578" y2="158" stroke="#58a6ff" stroke-width="2" marker-end="url(#harrowBlue)"/>
  <text x="548" y="146" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#79c0ff">tasks</text>

  <!-- ============ Workers ============ -->
  <g>
    <rect x="582" y="66" width="278" height="184" rx="10" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <rect x="582" y="66" width="278" height="26" rx="10" fill="#238636"/>
    <rect x="582" y="80" width="278" height="12" fill="#238636"/>
    <text x="721" y="85" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">arachne-worker</text>
    <rect x="598" y="104" width="246" height="24" rx="6" fill="#12261e" stroke="#2ea043" stroke-width="1"/>
    <text x="721" y="120" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#56d364">streaming .part + Range resume</text>
    <rect x="598" y="136" width="119" height="24" rx="6" fill="#12261e" stroke="#2ea043" stroke-width="1"/>
    <text x="657" y="152" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#56d364">magic bytes</text>
    <rect x="725" y="136" width="119" height="24" rx="6" fill="#12261e" stroke="#2ea043" stroke-width="1"/>
    <text x="784" y="152" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#56d364">lofty probe</text>
    <rect x="598" y="168" width="119" height="24" rx="6" fill="#12261e" stroke="#2ea043" stroke-width="1"/>
    <text x="657" y="184" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#56d364">quality gates</text>
    <rect x="725" y="168" width="119" height="24" rx="6" fill="#12261e" stroke="#2ea043" stroke-width="1"/>
    <text x="784" y="184" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#56d364">sha256 dedup</text>
    <text x="721" y="218" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">failures quarantined, never deleted</text>
    <text x="721" y="236" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">robots.txt + per-host caps apply</text>
  </g>

  <!-- arrow workers -> store -->
  <line x1="721" y1="250" x2="721" y2="288" stroke="#3fb950" stroke-width="2" marker-end="url(#harrowGreen)"/>

  <!-- ============ Store row ============ -->
  <g>
    <rect x="582" y="292" width="278" height="72" rx="10" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="721" y="315" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">content-addressed store</text>
    <text x="721" y="334" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#7ee787">&lt;source&gt;/&lt;collection&gt;/&lt;sha[0:2]&gt;/&lt;sha256&gt;.&lt;ext&gt;</text>
    <text x="721" y="353" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">coordinator completes each manifest row on result</text>
  </g>

  <!-- arrow store/manifest -> handoff -->
  <line x1="582" y1="328" x2="512" y2="346" stroke="#d2a8ff" stroke-width="2" marker-end="url(#harrowPurple)"/>

  <!-- ============ Track manifest node ============ -->
  <g>
    <rect x="302" y="300" width="206" height="56" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="405" y="323" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">track manifest</text>
    <text x="405" y="342" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#d2a8ff">provenance + license</text>
  </g>

  <!-- arrow manifest -> handoff -->
  <line x1="302" y1="328" x2="232" y2="346" stroke="#d2a8ff" stroke-width="2" marker-end="url(#harrowPurple)"/>

  <!-- ============ Handoff bundle ============ -->
  <g>
    <rect x="40" y="304" width="192" height="88" rx="10" fill="#161b22" stroke="#bb8009" stroke-width="1.5"/>
    <text x="136" y="326" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e3b341">handoff bundle</text>
    <text x="136" y="347" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e3b341">manifest.jsonl.zst</text>
    <text x="136" y="365" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e3b341">+ attribution.txt</text>
  </g>

  <!-- stage labels along the top -->
  <text x="130" y="44" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1" fill="#656d76">SOURCES</text>
  <text x="410" y="44" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1" fill="#656d76">ADMIT</text>
  <text x="721" y="44" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1" fill="#656d76">DOWNLOAD + VERIFY</text>
  <text x="450" y="398" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#656d76">arachne harvest → workers → arachne tracks-export — every stored file traces to origin page, license, and license deed URL</text>
</svg>
