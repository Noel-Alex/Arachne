<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Arachne architecture: CLI publishes to NATS JetStream; workers fetch and process tasks; coordinator runs admission control and persists to PostgreSQL and the content-addressed store">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- panels -->
  <rect x="1" y="1" width="898" height="558" rx="14" fill="#010409"/>
  <rect x="12" y="12" width="876" height="536" rx="10" fill="#0d1117"/>

  <!-- ============ CLI ============ -->
  <g>
    <rect x="340" y="34" width="220" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="450" y="61" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">arachne CLI</text>
    <text x="450" y="82" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">seed · crawl · harvest · tracks-export</text>
  </g>

  <!-- arrow CLI -> NATS -->
  <line x1="450" y1="98" x2="450" y2="130" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ NATS JetStream ============ -->
  <g>
    <rect x="250" y="134" width="400" height="86" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <rect x="250" y="134" width="400" height="26" rx="10" fill="#1f6feb"/>
    <rect x="250" y="148" width="400" height="12" fill="#1f6feb"/>
    <text x="450" y="153" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">NATS JetStream</text>
    <!-- stream chips -->
    <rect x="266" y="172" width="118" height="30" rx="6" fill="#0d1117" stroke="#388bfd" stroke-width="1"/>
    <text x="325" y="191" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#79c0ff">CRAWL_TASKS</text>
    <rect x="396" y="172" width="118" height="30" rx="6" fill="#0d1117" stroke="#388bfd" stroke-width="1"/>
    <text x="455" y="191" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#79c0ff">CRAWL_RESULTS</text>
    <rect x="526" y="172" width="118" height="30" rx="6" fill="#0d1117" stroke="#388bfd" stroke-width="1"/>
    <text x="585" y="190.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#79c0ff">DISCOVERED_URLS</text>
  </g>

  <!-- fan-out arrows NATS -> workers -->
  <line x1="325" y1="216" x2="180" y2="254" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="450" y1="220" x2="450" y2="254" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="575" y1="216" x2="720" y2="254" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ============ Workers ============ -->
  <g>
    <rect x="70" y="258" width="220" height="92" rx="10" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="180" y="283" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">arachne-worker ×N</text>
    <rect x="88" y="296" width="184" height="24" rx="6" fill="#12261e" stroke="#2ea043" stroke-width="1"/>
    <text x="180" y="312" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#56d364">fetch → verify → probe → store</text>
    <text x="180" y="339" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">robots + per-domain rate limits</text>
  </g>
  <g opacity="0.75">
    <rect x="340" y="258" width="220" height="92" rx="10" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="450" y="310" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">arachne-worker</text>
  </g>
  <g opacity="0.45">
    <rect x="610" y="258" width="220" height="92" rx="10" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="720" y="310" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">arachne-worker</text>
  </g>

  <!-- merge arrows workers -> coordinator -->
  <line x1="180" y1="350" x2="380" y2="392" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="450" y1="350" x2="450" y2="392" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="720" y1="350" x2="520" y2="392" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ============ Coordinator ============ -->
  <g>
    <rect x="290" y="396" width="320" height="120" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <rect x="290" y="396" width="320" height="26" rx="10" fill="#8957e5"/>
    <rect x="290" y="410" width="320" height="12" fill="#8957e5"/>
    <text x="450" y="415" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">arachne-coordinator</text>
    <rect x="306" y="432" width="140" height="24" rx="6" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
    <text x="376" y="448" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#d2a8ff">admission control</text>
    <rect x="456" y="432" width="138" height="24" rx="6" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
    <text x="525" y="448" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#d2a8ff">Bloom + DB dedup</text>
    <rect x="306" y="464" width="140" height="24" rx="6" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
    <text x="376" y="480" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#d2a8ff">job policy gates</text>
    <rect x="456" y="464" width="138" height="24" rx="6" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
    <text x="525" y="480" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#d2a8ff">manifest writes</text>
    <text x="450" y="507" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">re-dispatches admitted URLs as new tasks</text>
  </g>

  <!-- coordinator -> Postgres -->
  <line x1="300" y1="492" x2="212" y2="512" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- coordinator -> media store -->
  <line x1="600" y1="492" x2="688" y2="512" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Storage row ============ -->
  <g>
    <rect x="60" y="516" width="170" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="145" y="534" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">PostgreSQL</text>
    <text x="145" y="551" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">(Scylla opt-in)</text>
  </g>
  <g>
    <rect x="670" y="516" width="190" height="44" rx="10" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="765" y="534" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">content-addressed store</text>
    <text x="765" y="551" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#7ee787">&lt;sha256&gt;.&lt;ext&gt;</text>
  </g>

  <!-- side annotations -->
  <text x="80" y="52" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8b949e">SSRF egress guard on every hop</text>
  <text x="80" y="70" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#656d76">redirects re-validated · robots.txt enforced</text>
  <text x="820" y="52" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8b949e">manual ACK on success</text>
  <text x="820" y="70" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#656d76">at-least-once delivery · crash-safe staging</text>
</svg>
