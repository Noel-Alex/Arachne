global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nats'
    metrics_path: /metrics
    static_configs:
      - targets: ['nats:8222']

  # Arachne binaries run on the host (cargo build --release), so Docker
  # reaches them via host.docker.internal. On Linux add
  # extra_hosts: ["host.docker.internal:host-gateway"] to the prometheus
  # service in docker-compose.yml.
  - job_name: 'arachne-worker'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:9191']
        labels:
          component: 'worker'

  - job_name: 'arachne-coordinator'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:9192']
        labels:
          component: 'coordinator'

  # PostgreSQL exporter would need a dedicated service (prometheuscommunity/
  # postgres-exporter) — enable when DB-level dashboards are wanted.
  #
  # Legacy ScyllaDB backend (docker compose --profile legacy-scylla):
  #   - job_name: 'scylla'
  #     static_configs:
  #       - targets: ['scylla:9180']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
