networks:
  arachne-net:
    driver: bridge

volumes:
  nats_data:
    driver: local
  scylla_data:
    driver: local
  postgres_data:
    driver: local
  grafana_data:
    driver: local

services:
  # --- MESSAGING (NATS JetStream) ---
  nats:
    image: nats:latest
    container_name: arachne-nats
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "-m"
      - "8222"
    ports:
      - "4223:4222"   # Client connections
      - "8223:8222"   # HTTP monitoring + Prometheus metrics
    volumes:
      - nats_data:/data
    restart: unless-stopped
    networks:
      - arachne-net

  # --- DATA STORE (PostgreSQL — recommended default backend) ---
  postgres:
    image: postgres:17-alpine
    container_name: arachne-postgres
    environment:
      POSTGRES_USER: arachne
      POSTGRES_PASSWORD: arachne
      POSTGRES_DB: arachne
    ports:
      - "5432:5432"   # SQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bounded footprint: a metadata catalog, not a time-series engine.
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arachne -d arachne"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - arachne-net

  # --- LEGACY STORE (ScyllaDB; only needed with database.backend="scylla") ---
  scylla:
    profiles: ["legacy-scylla"]
    image: scylladb/scylla:latest
    container_name: arachne-scylla
    ports:
      - "9042:9042"   # CQL native protocol
      - "9180:9180"   # Prometheus metrics
    volumes:
      - scylla_data:/var/lib/scylla
    command:
      - --smp=1
      - --developer-mode=1
      - --memory=1G
      - --cluster-name=arachne-cluster
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep '^UN'"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - arachne-net

  # --- MONITORING STACK ---
  prometheus:
    image: prom/prometheus:latest
    container_name: arachne-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deploy/monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    networks:
      - arachne-net
    depends_on:
      - nats
      - postgres

  loki:
    image: grafana/loki:latest
    container_name: arachne-loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - arachne-net

  promtail:
    image: grafana/promtail:latest
    container_name: arachne-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./deploy/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - arachne-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: arachne-grafana
    user: "472"
    ports:
      - "3001:3000"   # host 3000 often taken by dev servers; UI on :3001
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    networks:
      - arachne-net
    depends_on:
      - prometheus
      - loki