[workspace]
members = [
    "arachne-core",
    "arachne-worker",
    "arachne-coordinator",
    "arachne-cli",
    "arachne-tools",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.44", features = ["full"] }

# Messaging (NATS JetStream)
async-nats = "0.40"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate", "stream", "cookies", "hickory-dns"] }

# HTML parsing
scraper = "0.22"
ego-tree = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
scylla = { version = "0.15", features = ["chrono-04"] }

# URL handling
url = "2.5"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging & Metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"

# Rate limiting
governor = "0.8"

# Domain extraction
psl = "2"

# Deduplication
bloomfilter = "1.0"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Configuration
dotenvy = "0.15"
figment = { version = "0.10", features = ["toml", "env"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Concurrency
dashmap = "6.1"
futures = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Content storage
object_store = { version = "0.11", features = ["aws"] }
bytes = "1.9"

# robots.txt
texting_robots = "0.2"

# Encoding detection
encoding_rs = "0.8"

# HTTP server (for metrics endpoint)
axum = "0.8"
